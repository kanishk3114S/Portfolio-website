<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Deep Abyss Background Radial -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#14161f" />
      <stop offset="65%" stop-color="#0a0b10" />
      <stop offset="100%" stop-color="#040407" />
    </radialGradient>

    <!-- Itachi Dark Pulse Aura -->
    <radialGradient id="pulseGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.75" />
      <stop offset="35%" stop-color="#b91c1c" stop-opacity="0.4" />
      <stop offset="70%" stop-color="#facc15" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Electric Gold Accent Linear -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#fef08a" />
      <stop offset="65%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>

    <!-- Crimson-to-Obsidian Blade Gradient -->
    <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="25%" stop-color="#991b1b" />
      <stop offset="60%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>

    <!-- Outer Rim Edge Gradient -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#facc15" />
      <stop offset="50%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#facc15" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="coreGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes slow-rotate {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes pulse-ring {
        0%, 100% { opacity: 0.6; transform: scale(1); }
        50% { opacity: 0.95; transform: scale(1.03); }
      }
      .ocular-spin {
        transform-origin: 64px 64px;
        animation: slow-rotate 24s linear infinite;
      }
      .pulse-ambient {
        transform-origin: 64px 64px;
        animation: pulse-ring 4s ease-in-out infinite;
      }
      @media (prefers-reduced-motion: reduce) {
        .ocular-spin, .pulse-ambient {
          animation: none !important;
        }
      }
    </style>
  </defs>

  <!-- 1. Deep Obsidian Disc with Rim Bezel -->
  <circle cx="64" cy="64" r="62" fill="url(#bgGrad)" />
  <circle cx="64" cy="64" r="62" fill="none" stroke="url(#rimGrad)" stroke-width="2" stroke-opacity="0.8" />

  <!-- 2. Dark Pulse Energy Aura -->
  <circle cx="64" cy="64" r="56" fill="url(#pulseGlow)" class="pulse-ambient" />

  <!-- 3. Outer HUD Reticle & Segmented Target Arcs -->
  <circle cx="64" cy="64" r="54" fill="none" stroke="#facc15" stroke-width="1.2" stroke-opacity="0.4" stroke-dasharray="14 10 28 10" />
  <circle cx="64" cy="64" r="50" fill="none" stroke="#ef4444" stroke-width="0.8" stroke-opacity="0.45" stroke-dasharray="6 6" />

  <!-- Cardinal Ocular Notches (3 Points: 0, 120, 240 deg) -->
  <g stroke="#facc15" stroke-width="2" stroke-linecap="round" opacity="0.85">
    <line x1="64" y1="6" x2="64" y2="12" />
    <line x1="114" y1="93" x2="109" y2="90" />
    <line x1="14" y1="93" x2="19" y2="90" />
  </g>

  <!-- 4. Rotating Mangekyō Sharingan 3-Blade Pinwheel -->
  <g class="ocular-spin" filter="url(#coreGlow)">
    <g id="bladeGroup">
      <!-- Master Pinwheel Sickle Blade (Curved aerodynamic scythe with gold rim) -->
      <path
        id="singleBlade"
        d="M 64 48 C 61 36 50 22 36 15 C 52 13 74 20 77 37 C 78 46 72 49 64 48 Z"
        fill="url(#bladeGrad)"
        stroke="url(#goldGrad)"
        stroke-width="1.4"
      />
      <use href="#singleBlade" transform="rotate(120 64 64)" />
      <use href="#singleBlade" transform="rotate(240 64 64)" />
    </g>

    <!-- Secondary Inner Accent Swirls -->
    <path
      d="M 64 48 C 66 52 68 56 64 60 C 60 56 62 52 64 48 Z"
      fill="#facc15"
      opacity="0.7"
    />
  </g>

  <!-- 5. Ocular Eye Bezel (Middle Core) -->
  <circle cx="64" cy="64" r="20" fill="#090a0f" stroke="url(#goldGrad)" stroke-width="2.5" />
  <circle cx="64" cy="64" r="16" fill="#ef4444" fill-opacity="0.3" stroke="#facc15" stroke-width="1" stroke-opacity="0.6" />

  <!-- 6. Ultra-Black Inner Pupil -->
  <circle cx="64" cy="64" r="13" fill="#050608" />

  <!-- 7. High-Contrast Electric Yellow 'K' Monogram -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Main Vertical Spine of K -->
    <line x1="58.5" y1="55" x2="58.5" y2="73" stroke="#facc15" stroke-width="3" />
    <!-- Diagonal Upper Arm -->
    <line x1="60" y1="64" x2="69" y2="55.5" stroke="#ffffff" stroke-width="2.8" />
    <!-- Diagonal Lower Arm -->
    <line x1="60" y1="64" x2="69.5" y2="72.5" stroke="#facc15" stroke-width="2.8" />
  </g>

  <!-- 8. Razor Core Specular Flare Dot -->
  <circle cx="64" cy="64" r="2" fill="#ffffff" />
</svg>
